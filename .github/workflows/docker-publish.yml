name: Docker Publish

on:
  push:
    branches:
      - master
      - webserver
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_NAME: andrewhills/ubuntu-web-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Determine image tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            master)    TAG=latest ;;
            webserver) TAG=webserver ;;
            *)
              echo "::error::Unsupported branch '$BRANCH'. Only 'master' and 'webserver' are published."
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
